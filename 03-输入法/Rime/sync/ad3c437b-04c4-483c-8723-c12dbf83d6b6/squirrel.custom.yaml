patch:
  style:
    # 核心配色方案
    color_scheme: apple_system_light    # 默认日间：原生明亮
    color_scheme_dark: apple_system_dark # 默认夜间：原生深色
    
    # --- 布局几何 (Geometry) ---
    # Apple 设计讲究“呼吸感”，适当增加边距
    window_height_status: 30
    border_height: 0                   # 上下边距增加，不再拥挤
    border_width: 0                    # 左右边距增加，视觉更平衡
    corner_radius: 8                   # 窗口圆角
    hilited_corner_radius: 6            # 高亮色块圆角，比窗口稍小，形成嵌套美感
    
    # --- 候选词布局 ---
    candidate_list_layout: linear       # 线性排列 (Horizontal)
    text_orientation: horizontal
    line_spacing: 5                     # 即使是水平排列，这个参数也会影响微调
    spacing: 15                         # 增加候选词之间的间距，防止误读
    
    # --- 字体排印 (Typography) ---
    # 使用 macOS 原生字体，并区分字号建立层级
    font_face: "PingFang SC"
    font_point: 17                      # 字号稍微调大至 17pt，这是 iOS/macOS 的标准正文字号
    label_font_point: 13                # 序号设为 13pt，作为辅助信息，视觉后退
    
    # --- 视觉反馈 (Feedback) ---
    candidate_format: '[label]. [candidate] [comment]'
    status_message_type: mix
    inline_preedit: true                # 这种“所见即所得”符合直觉
    inline_candidate: false
    showPaging: false                   # 去掉翻页符，极简主义
    
    # --- 材质特效 (Materials) ---
    translucency: true                  # 开启半透明
    blur: true                          # 开启背景模糊 (关键)
    shadow_size: 8                      # 阴影更柔和，产生悬浮感 (Depth)
    alpha: 1.0                          # 保持窗口 Alpha 为 1，通过背景色控制透明度

  preset_color_schemes:
    #  macOS Light Theme (System Blue)
    apple_system_light:
      name: "Apple System Light"
      author: Apple Design
      color_space: srgb
      # 这里的颜色代码格式为：0xAA(透明度)BB(蓝)GG(绿)RR(红)
      
      # 背景：模拟 macOS 菜单的高透磨砂白 (Alpha: E6 = 90%)
      back_color: '0xE6FFFFFF'
      border_color: '0xE6FFFFFF'
      
      # 输入编码：深灰，清晰但不刺眼
      text_color: '0x333333'
      hilited_text_color: '0xFF7A00'    # 输入中高亮：System Blue (R:0 G:122 B:255 -> Hex: FF7A00)
      
      # 候选词：标准黑
      candidate_text_color: '0x000000'
      label_color: '0x8E8E93'           # 序号：System Gray (辅助色)
      comment_text_color: '0xC7C7CC'    # 拼音/注解：更浅的灰
      
      # 选中态：高对比度
      hilited_candidate_back_color: '0xFF7A00' # 背景：System Blue
      hilited_candidate_text_color: '0xFFFFFF' # 文字：纯白
      hilited_candidate_label_color: '0xCCFFFF' # 序号：微透白

    #  macOS Dark Theme (Deep Space)
    apple_system_dark:
      name: "Apple System Dark"
      author: Apple Design
      color_space: srgb
      
      # 背景：模拟 macOS Dark Mode HUD，深灰磨砂 (Alpha: D9 = 85%)
      back_color: '0xD91E1E1E'          # 接近 #1E1E1E
      border_color: '0x001E1E1E'        # 无边框或全透
      
      # 输入编码：亮灰
      text_color: '0xF2F2F7'
      hilited_text_color: '0xFF9F0A'    # 输入中高亮：稍暖的 System Orange/Blue 变体，增加暗色下的易读性
      
      # 候选词：纯白
      candidate_text_color: '0xFFFFFF'
      label_color: '0x8E8E93'           # 序号：System Gray
      comment_text_color: '0x636366'    # 拼音/注解：暗灰
      
      # 选中态
      hilited_candidate_back_color: '0xFF7A00' # 背景：System Blue
      hilited_candidate_text_color: '0xFFFFFF' # 文字：纯白
      hilited_candidate_label_color: '0xFFFFFF' # 序号：纯白