# rime_mint_flypy.custom.yaml
# 覆写薄荷小鹤双拼方案，使候选注释中的 ü 显示为 v（符合双拼习惯）

patch:
  # 修改候选词下方的拼音注释格式
  translator/comment_format:
    - xform/([nljqxy])ü/$1v/     # nü → nv, lü → lv（jqxy 后实际无 ü，但规则通用）
    - xform/([nl])üe/$1ve/       # nüe → nve, lüe → lve

  # （可选）如果你也希望在「错音提示」或「预编辑」中统一用 v，可取消下面注释
  speller/algebra/@before 0: xlit/ü/v/